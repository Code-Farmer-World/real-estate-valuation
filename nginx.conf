# 前端只送靜態檔。API 由瀏覽器直接打 VITE_API_URL（見 .env.production），
# 不經過這台 nginx，所以這裡沒有 proxy_pass，上傳大小也不歸這裡管。
#
# 代價是跨網域：後端必須把前端的來源加進 CORS 白名單，否則所有請求都會被瀏覽器
# 擋下來，而且錯誤訊息看不出是 CORS（見 ../real-estate-valuation-py/api/main.py）。

server {
    listen 80;
    server_name _;

    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # 注意 nginx 的 add_header 不會被 location 繼承：下面任何一個 location 只要
    # 自己寫了 add_header，這三行就會在該 location 失效，要的話得再寫一次。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 路由用 createWebHistory（見 src/router/index.ts），網址列上的路徑在磁碟上
    # 沒有對應檔案。少了這行 try_files，直接輸入網址或 F5 會是 nginx 的 404，
    # 而不是進到前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 產出的檔名帶 content hash，內容變了檔名就跟著變，可以放心長快取。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 反過來絕對不能快取：它是 asset 檔名的唯一入口，
    # 被快取住就會一直去要上一版、已經不存在的 js 檔。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log off;
    error_log /var/log/nginx/error.log error;
}
